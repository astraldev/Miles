name: Release

on:
  push:
    tags: ['*-mac.*']
  workflow_dispatch:
    inputs:
      tag:
        description: A tag to build and draft a release for. Empty builds the branch.
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Disk image (Apple silicon)
    # The app runs on this version of MacOS and newer: Homebrew's libraries are built for it.
    runs-on: macos-15
    timeout-minutes: 90
    env:
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install dependencies
        run: |
          # The runner's Homebrew is old, and its OpenSSL is in the way of the new one.
          brew update
          brew install --overwrite openssl@3
          brew install meson ninja pkgconf gettext \
            gtk4 libadwaita gnome-autoar libarchive icu4c tinysparql \
            gsettings-desktop-schemas gdk-pixbuf iso-codes xkeyboard-config \
            pygobject3 libsoup libgcrypt glib-networking \
            adwaita-icon-theme hicolor-icon-theme librsvg ca-certificates
          pipx install dmgbuild

      - name: Set up the environment
        run: |
          brew_prefix=$(brew --prefix)
          # blueprint-compiler needs the Python that has PyGObject.
          echo "$(brew --prefix python3)/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$PWD/prefix/lib/pkgconfig:$(brew --prefix icu4c)/lib/pkgconfig:$(brew --prefix libarchive)/lib/pkgconfig:$brew_prefix/lib/pkgconfig:$brew_prefix/share/pkgconfig" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          meson setup build --prefix="$PWD/prefix" \
            -Dextensions=false -Dintrospection=false -Ddocs=false \
            -Dselinux=disabled -Dcloudproviders=disabled -Dtests=none

      - name: Build and install
        run: ninja -C build install

      - name: Make the app
        run: ninja -C build app

      - name: Make the disk image
        run: ninja -C build dmg

      - name: Keep the disk image
        uses: actions/upload-artifact@v4
        with:
          name: disk-image
          path: build/*.dmg

      - name: Draft the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/Miles.app/Contents/Resources/licenses/THIRD-PARTY-NOTICES.md build/
          gh release create "$TAG" build/*.dmg build/THIRD-PARTY-NOTICES.md \
            --verify-tag --draft --generate-notes --title "Miles $TAG"

      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs
          path: build/meson-logs/
